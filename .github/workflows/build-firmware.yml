name: build-firmware

# Cloud build for the DSH dial firmware.
#
# The point is that nobody needs a local toolchain: this job compiles the
# firmware on every push and publishes artifacts that the browser flasher
# (docs/index.html) can install over WebSerial. A tag also produces a Release
# so the flasher can pin a known-good build instead of a moving branch.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed only by the release step on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PlatformIO downloads a large toolchain and the LVGL/ArduinoJson
      # libraries; caching both keeps repeat builds to about a minute.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        working-directory: firmware
        run: pio run

      # A merged single-file image is what the browser flasher writes at
      # offset 0; it already contains the bootloader, partition table and
      # application, so the flasher needs no offset table of its own.
      - name: Merge into a single flashable image
        working-directory: firmware
        run: |
          PIO_DIR=.pio/build/waveshare-1_85b
          pio pkg exec --package "platformio/tool-esptoolpy" -- esptool.py \
            --chip esp32s3 merge_bin \
            --output dsh-dial-merged.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0 "$PIO_DIR/bootloader.bin" \
            0x8000 "$PIO_DIR/partitions.bin" \
            0x10000 "$PIO_DIR/firmware.bin"
          ls -la dsh-dial-merged.bin

      - name: Report sizes
        working-directory: firmware
        run: |
          echo "### Firmware size" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pio run --target size 2>&1 | tail -n 25 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-dial-firmware
          path: |
            firmware/dsh-dial-merged.bin
            firmware/.pio/build/waveshare-1_85b/firmware.bin
            firmware/.pio/build/waveshare-1_85b/bootloader.bin
            firmware/.pio/build/waveshare-1_85b/partitions.bin
          if-no-files-found: error

      # Publish the merged image to the flasher page's own directory so the
      # GitHub Pages flasher can fetch it from a stable path.
      - name: Stage firmware for Pages
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        run: |
          mkdir -p pages
          cp -r docs/* pages/
          cp firmware/dsh-dial-merged.bin pages/dsh-dial-merged.bin
          # Record which commit produced the binary the page will offer.
          cat > pages/build-info.json <<JSON
          {
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref_name }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "runNumber": "${{ github.run_number }}"
          }
          JSON

      - name: Upload Pages artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/dsh-dial-merged.bin
            firmware/.pio/build/waveshare-1_85b/firmware.bin
          generate_release_notes: true

  # Publishing runs as its own job because GitHub Pages deployment needs the
  # pages/id-token permissions, which the build job deliberately does not hold.
  deploy-pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4