[platformio]
default_envs = waveshare-1_85b

[env:waveshare-1_85b]
; pioarduino's ESP32 platform: the Arduino-ESP32 3.x core that the vendored
; drivers were written against (ESP_I2S, esp_lcd_st77916, ES8311 all assume it).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DLV_CONF_INCLUDE_SIMPLE
  -Ivendor
  -Iinclude
  -DCORE_DEBUG_LEVEL=1

; The vendored drivers live outside src/, so they are added as an extra source
; directory rather than a library — that keeps their include paths flat and lets
; them see the framework headers directly.
build_src_filter = +<*> +<../vendor/>

lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5
  lvgl/lvgl @ 8.4.0
  ; Require the Arduino core libraries explicitly.  The wires from vendor/
  ; headers (Wire, SPI, FS) and from our own sources (WiFi, Network, WebServer,
  ; DNSServer, Preferences) are not reachable by the dependency finder when the
  ; headers live outside src/ or lib/, so they must be named here.  PlatformIO
  ; resolves these names against the installed framework.
  Wire
  Network
  SPI
  FS
  Preferences
  DNSServer

; Wire/WiFi/Preferences/WebServer/DNSServer/ESP_I2S ship with the Arduino core.
; `deep+` makes the dependency finder follow includes reached through the vendor
; sources as well as src/; without it the vendored headers fail with
; "Wire.h: No such file or directory". Compatibility filtering stays at its
; default, because the core libraries depend on each other (WiFi needs Network)
; and relaxing it breaks those internal links.
lib_ldf_mode = deep+