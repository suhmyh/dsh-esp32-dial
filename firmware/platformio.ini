[platformio]
default_envs = waveshare-1_85b

[env:waveshare-1_85b]
; pioarduino's ESP32 platform: the Arduino-ESP32 3.x core that the vendored
; drivers were written against (ESP_I2S, esp_lcd_st77916, ES8311 all assume it).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DLV_CONF_INCLUDE_SIMPLE
  -DCORE_DEBUG_LEVEL=1
  -Isrc/vendor

; Arduino-ESP32 3.x splits the old WiFi stack: WiFi now depends on the separate
; Networking library (its headers live in libraries/Networking/src).  The
; dependency finder follows this automatically, but only when the libraries are
; resolved from src/ — the vendored drivers used to sit outside src/, which is
; why Wire.h and Network.h kept going missing.  They now live in src/vendor/ and
; the finder sees their includes, so only the third-party packages remain here.
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5
  lvgl/lvgl @ 8.4.0