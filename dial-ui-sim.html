<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH 圆盘 UI 模拟</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;gap:40px;flex-wrap:wrap;padding:20px}
/* 圆盘本体 */
.dial{width:360px;height:360px;border-radius:50%;background:#0D111D;position:relative;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5),inset 0 0 30px rgba(0,0,0,.3);flex:none}
/* 状态色背景 */
.dial .bg{position:absolute;inset:0;border-radius:50%;transition:background .6s}
/* 外圈弧线 */
.arc{position:absolute;top:8px;left:8px;right:8px;bottom:8px;border-radius:50%;pointer-events:none}
.arc-track{stroke:#1a1a2e;stroke-width:7;fill:none}
.arc-fill{stroke-width:7;fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s,stroke .5s;transform:rotate(-90deg);transform-origin:center}
/* 内容 */
.content{position:absolute;inset:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.icon{font-size:64px;line-height:1;margin-bottom:8px;transition:all .4s;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.title{font-size:16px;font-weight:600;color:#fff;margin-bottom:4px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .3s}
.detail{font-size:13px;color:#8891a5;max-width:280px}
.detail.ok{color:#4CAF50}
.detail.err{color:#E53935}
/* 底部品牌 */
.brand{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:10px;color:#3a3f52;letter-spacing:2px;z-index:2}
/* 审批覆盖层 */
.ask-overlay{position:absolute;inset:0;border-radius:50%;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;background:#F5C518;transition:opacity .3s}
.ask-overlay.show{display:flex}
.ask-icon{font-size:36px;margin-bottom:8px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.1))}
.ask-title{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:4px}
.ask-body{font-size:14px;color:#5c4a1a;margin-bottom:20px;max-width:260px;text-align:center}
.ask-btns{display:flex;gap:12px}
.ask-btn{padding:8px 24px;border:none;border-radius:20px;font-size:16px;font-weight:700;cursor:pointer;min-width:80px;transition:transform .15s}
.ask-btn:active{transform:scale(.95)}
.ask-btn.allow{background:#1b5e20;color:#fff}
.ask-btn.deny{background:#b71c1c;color:#fff}
.ask-btn.timeout{background:#666;color:#fff}
/* 配网覆盖层 */
.prov-overlay{position:absolute;inset:0;border-radius:50%;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#1E88E5}
.prov-overlay.show{display:flex}
.prov-title{font-size:16px;font-weight:600;color:#fff;margin-bottom:12px;text-align:center}
.prov-qr{width:140px;height:140px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:10px;color:#888;position:relative}
.prov-qr svg{width:120px;height:120px}
.prov-creds{font-size:12px;color:#cce6ff;text-align:center;margin-bottom:4px;word-break:break-all}
.prov-url{font-size:13px;color:#ffd97a;font-weight:600}
/* 状态切换控件 */
.controls{background:#151a28;border:1px solid #252c3d;border-radius:16px;padding:24px;width:320px;color:#e8eaf0}
.controls h2{font-size:14px;margin-bottom:12px;color:#8891a5;font-weight:600}
.controls label{display:block;margin:8px 0 3px;font-size:12px;color:#8891a5}
.controls select,.controls input[type=text],.controls input[type=range]{width:100%;padding:8px;border:1px solid #333;border-radius:8px;background:#0a0e16;color:#fff;font-size:13px;outline:0}
.controls select:focus,.controls input:focus{border-color:#1E88E5}
.controls input[type=range]{-webkit-appearance:none;height:4px;border:none;background:#333;border-radius:2px;padding:0}
.controls input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#1E88E5;cursor:pointer}
.controls .row{display:flex;gap:8px;margin-top:12px}
.controls .row button{flex:1;padding:8px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:#1E88E5;color:#fff;transition:filter .15s}
.controls .row button:hover{filter:brightness(1.1)}
.controls .row button.ghost{background:transparent;border:1px solid #333;color:#8891a5}
.controls .row button.ghost:hover{background:#1a1a2e}
.controls .note{font-size:11px;color:#666;margin-top:8px;padding:8px;background:#0a0e16;border-radius:6px}
</style>
</head>
<body>

<!-- 圆盘 -->
<div class="dial" id="dial">
  <div class="bg" id="dialBg" style="background:#2a2d3a"></div>
  <!-- 弧线 -->
  <svg class="arc" viewBox="0 0 344 344">
    <circle class="arc-track" cx="172" cy="172" r="162"/>
    <circle class="arc-fill" id="arcFill" cx="172" cy="172" r="162"
      stroke="#4CAF50" stroke-dasharray="1018" stroke-dashoffset="1018"/>
  </svg>
  <!-- 主内容 -->
  <div class="content" id="mainContent">
    <div class="icon" id="phaseIcon">⏸</div>
    <div class="title" id="titleText">DSH</div>
    <div class="detail" id="detailText">等待命令…</div>
  </div>
  <div class="brand">DSH DIAL</div>

  <!-- 审批覆盖层 -->
  <div class="ask-overlay" id="askOverlay">
    <div class="ask-icon">⚠️</div>
    <div class="ask-title" id="askTitle">需要审批</div>
    <div class="ask-body" id="askBody">确认执行以下命令？</div>
    <div class="ask-btns">
      <button class="ask-btn allow">允许</button>
      <button class="ask-btn deny">拒绝</button>
    </div>
  </div>

  <!-- 配网覆盖层 -->
  <div class="prov-overlay" id="provOverlay">
    <div class="prov-title" id="provTitle">首次配置 · 手机扫码连接</div>
    <div class="prov-qr">
      <svg viewBox="0 0 33 33"><rect width="33" height="33" fill="#fff"/>
        <path d="M4 4h4v4H4zM12 4h4v4h-4zM20 4h4v4h-4zM4 12h4v4H4zM12 12h4v4h-4zM20 12h4v4h-4zM4 20h4v4H4zM12 20h4v4h-4zM20 20h4v4h-4zM8 8h4v4H8zM16 8h4v4h-4zM24 8h4v4h-4zM8 16h4v4H8zM16 16h4v4h-4zM24 16h4v4h-4zM8 24h4v4H8zM16 24h4v4h-4zM24 24h4v4h-4z" fill="#111"/>
        <path d="M4 28h4v4H4zM12 28h4v4h-4zM20 28h4v4h-4zM28 28h4v4h-4zM28 4h4v4h-4zM28 12h4v4h-4zM28 20h4v4h-4z" fill="#111"/>
      </svg>
    </div>
    <div class="prov-creds" id="provCreds">DSH-Dial-XXXX / 12345678</div>
    <div class="prov-url" id="provUrl">http://192.168.4.1</div>
  </div>
</div>

<!-- 控制面板 -->
<div class="controls">
  <h2>🎛 状态切换</h2>
  <label>当前状态</label>
  <select id="phaseSelect">
    <option value="idle">空闲 (Idle) — 灰色·⏸</option>
    <option value="working" selected>工作中 (Working) — 蓝色·⏳</option>
    <option value="waiting">审批中 (Waiting) — 黄色·⚠️</option>
    <option value="done">已完成 (Done) — 绿色·✓</option>
    <option value="error">出错 (Error) — 红色·✕</option>
    <option value="offline">离线 (Offline) — 灰色·🔌</option>
  </select>
  <label>上下文压力 (ctx)</label>
  <input type="range" id="ctxSlider" min="0" max="100" value="30">
  <label>会话标题</label>
  <input type="text" id="titleInput" value="询问 AI 助手身份">
  <label>详情</label>
  <input type="text" id="detailInput" value="正在向 AI 助手发送身份确认请求…">
  <div class="row">
    <button onclick="showAsk()">显示审批</button>
    <button class="ghost" onclick="hideAsk()">关闭审批</button>
  </div>
  <div class="row">
    <button onclick="showProv()">显示配网</button>
    <button class="ghost" onclick="hideProv()">关闭配网</button>
  </div>
  <div class="note">💡 圆盘 360×360 圆形屏幕模拟。审批和配网会覆盖主界面。</div>
</div>

<script>
const $ = id => document.getElementById(id);
const dial = $('dial');
const bg = $('dialBg');
const icon = $('phaseIcon');
const titleText = $('titleText');
const detailText = $('detailText');
const arcFill = $('arcFill');
const askOverlay = $('askOverlay');
const provOverlay = $('provOverlay');
const arcLen = 1018; // 2*PI*162

const states = {
  idle:    { icon:'⏸',  bg:'#2a2d3a', arc:'#4CAF50', title:'', detail:'等待命令' },
  working: { icon:'⏳',  bg:'#1E88E5', arc:'#1E88E5', title:'', detail:'正在执行…' },
  waiting: { icon:'⚠️', bg:'#F5C518', arc:'#F5C518', title:'', detail:'等待你的决定' },
  done:    { icon:'✓',  bg:'#1b5e20', arc:'#4CAF50', title:'', detail:'已完成' },
  error:   { icon:'✕',  bg:'#b71c1c', arc:'#E53935', title:'', detail:'出错了' },
  offline: { icon:'🔌', bg:'#1a1a2e', arc:'#666',    title:'', detail:'连接断开' },
};

function updateUI(){
  const phase = $('phaseSelect').value;
  const s = states[phase];
  const ctx = parseInt($('ctxSlider').value);
  const title = $('titleInput').value || s.title;
  const detail = $('detailInput').value || s.detail;
  
  bg.style.background = s.bg;
  icon.textContent = s.icon;
  titleText.textContent = title;
  detailText.textContent = detail;
  detailText.className = 'detail' + (phase==='done'?' ok':phase==='error'?' err':'');
  
  arcFill.style.stroke = s.arc;
  arcFill.style.strokeDashoffset = arcLen * (1 - ctx/100);
  
  askOverlay.classList.remove('show');
  provOverlay.classList.remove('show');
}

$('phaseSelect').addEventListener('change', updateUI);
$('ctxSlider').addEventListener('input', updateUI);
$('titleInput').addEventListener('input', updateUI);
$('detailInput').addEventListener('input', updateUI);

function showAsk(){
  askOverlay.classList.add('show');
  provOverlay.classList.remove('show');
}
function hideAsk(){
  askOverlay.classList.remove('show');
}
function showProv(){
  provOverlay.classList.add('show');
  askOverlay.classList.remove('show');
}
function hideProv(){
  provOverlay.classList.remove('show');
}

updateUI();
</script>
</body>
</html>
