<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH 圆盘 UI 模拟 v4 — 键盘 + 语音</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;gap:40px;flex-wrap:wrap;padding:20px}
.dial{width:360px;height:360px;border-radius:50%;background:#0D111D;position:relative;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5),inset 0 0 30px rgba(0,0,0,.3);flex:none}
.dial .bg{position:absolute;inset:0;border-radius:50%;transition:background .6s}
.content{position:absolute;inset:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.icon{font-size:56px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.title{font-size:17px;font-weight:600;color:#fff;margin-bottom:2px;max-width:260px}
.detail{font-size:13px;color:#8891a5;max-width:280px;margin-bottom:4px}
.detail.ok{color:#4CAF50}
.detail.err{color:#E53935}
.status-bar{position:absolute;bottom:14px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#3a3f52;z-index:3;pointer-events:none}
.status-bar .item{display:flex;align-items:center;gap:4px}
.status-bar .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.status-bar .dot.on{background:#4CAF50}
.status-bar .dot.off{background:#666}
.status-bar .battery{display:flex;align-items:center;gap:3px;font-size:10px}
.status-bar .battery .bar{width:14px;height:8px;border:1px solid #3a3f52;border-radius:2px;padding:1px;display:flex}
.status-bar .battery .bar div{height:100%;border-radius:1px;background:#4CAF50}
.queue-indicator{position:absolute;top:12px;right:16px;background:rgba(0,0,0,.3);border-radius:10px;padding:2px 8px;font-size:10px;color:#8891a5;z-index:3;display:flex;align-items:center;gap:4px}
/* ═══ 审批弹窗 ═══ */
.ask-overlay{position:absolute;inset:0;border-radius:50%;z-index:5;display:none;flex-direction:column;align-items:center;padding:24px 24px 16px;background:#F5C518}
.ask-overlay.show{display:flex}
.ask-top{width:100%;text-align:center}
.ask-agent{font-size:11px;color:#8a6d00;margin-bottom:1px;font-weight:600}
.ask-title{font-size:16px;font-weight:700;color:#1a1a2e;margin-bottom:1px;line-height:1.3}
.ask-sub{font-size:10px;color:#8a6d00;margin-top:2px}
.ask-body{font-size:12px;color:#5c4a1a;margin-top:4px;max-width:280px;text-align:center;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ask-main{flex:1;width:100%;display:flex;flex-direction:column;justify-content:center;overflow-y:auto;padding:4px 0;min-height:0}
.ask-main::-webkit-scrollbar{width:0}
/* 选项按钮 */
.opt{width:100%;padding:10px 14px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:transform .12s;text-align:left}
.opt:active{transform:scale(.97)}
.opt.danger{background:#fff;color:#b71c1c;border:2px solid #b71c1c}
.opt.primary{background:#1b5e20;color:#fff}
.opt.neutral{background:#fff;color:#1a1a2e;border:2px solid #8a6d00}
.opt.danger::after{content:'✕';font-weight:700}
.opt.primary::after{content:'✓';font-weight:700}
.opt.neutral::after{content:'›'}
.opt.checkbox::after{content:'○';font-weight:700}
.opt.checkbox.selected{background:#1b5e20;color:#fff;border-color:#1b5e20}
.opt.checkbox.selected::after{content:'●'}
.opt.confirm{justify-content:center;background:#1a1a2e;color:#fff;border:none}
.opt.confirm::after{content:''}
.opt.confirm:disabled{opacity:.35}
.ask-footer{width:100%;display:flex;gap:8px;padding-top:4px}
.ask-footer .fbtn{flex:1;padding:9px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .12s}
.ask-footer .fbtn:active{transform:scale(.96)}
.ask-footer .fbtn.ghost{background:transparent;border:1.5px solid #8a6d00;color:#5c4a1a}
.ask-footer .fbtn.primary{background:#1a1a2e;color:#fff}
/* ═══ T9 键盘 ═══ */
.t9-keyboard{margin:4px 0 2px}
.t9-row{display:flex;gap:4px;margin-bottom:4px;justify-content:center}
.t9-key{width:52px;height:36px;border:none;border-radius:8px;background:#fff;color:#1a1a2e;font-size:14px;font-weight:700;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;transition:transform .1s}
.t9-key:active{transform:scale(.9);background:#ddd}
.t9-key .sub{font-size:8px;font-weight:400;color:#8a6d00}
.t9-key.wide{width:74px}
.t9-key.fn{background:#1a1a2e;color:#fff;font-size:12px}
.t9-key.space{flex:1;max-width:140px}
.t9-row:last-child{margin-bottom:0}
.t9-input{width:100%;background:#fff;border-radius:8px;padding:6px 10px;font-size:14px;color:#1a1a2e;display:flex;align-items:center;gap:4px;min-height:30px;margin-bottom:4px;border:2px solid #8a6d00}
.t9-input .cursor{width:2px;height:16px;background:#1a1a2e;animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.t9-input .ph{color:#aaa;font-weight:400}
/* ═══ 语音输入 ═══ */
.voice-section{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0}
.voice-btn{width:90px;height:90px;border-radius:50%;border:4px solid #8a6d00;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;transition:all .2s;color:#8a6d00}
.voice-btn:active{transform:scale(1.08);background:#fff3d0;border-color:#b71c1c;color:#b71c1c;box-shadow:0 0 20px rgba(183,28,28,.3)}
.voice-btn .label{font-size:10px;font-weight:700;margin-top:2px;color:inherit}
.voice-hint{font-size:11px;color:#8a6d00}
.voice-wave{display:flex;gap:3px;align-items:center;height:20px}
.voice-wave div{width:3px;background:#b71c1c;border-radius:2px;animation:wave 1s ease-in-out infinite;height:6px}
.voice-wave div:nth-child(2){height:14px;animation-delay:.15s}
.voice-wave div:nth-child(3){height:20px;animation-delay:.3s}
.voice-wave div:nth-child(4){height:14px;animation-delay:.45s}
.voice-wave div:nth-child(5){height:6px;animation-delay:.6s}
@keyframes wave{0%,100%{height:6px;opacity:.4}50%{height:18px;opacity:1}}
/* ═══ 配网 ═══ */
.prov-overlay{position:absolute;inset:0;border-radius:50%;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:#1E88E5}
.prov-overlay.show{display:flex}
.prov-title{font-size:15px;font-weight:600;color:#fff;margin-bottom:12px;text-align:center}
.prov-qr{width:140px;height:140px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;flex-shrink:0}
.prov-qr svg{width:120px;height:120px}
.prov-creds{font-size:12px;color:#cce6ff;text-align:center;margin-bottom:2px;word-break:break-all}
.prov-url{font-size:13px;color:#ffd97a;font-weight:600}
/* ═══ 控件 ═══ */
.controls{background:#151a28;border:1px solid #252c3d;border-radius:16px;padding:24px;width:340px;color:#e8eaf0}
.controls h2{font-size:14px;margin-bottom:12px;color:#8891a5;font-weight:600}
.controls label{display:block;margin:8px 0 3px;font-size:12px;color:#8891a5}
.controls select,.controls input[type=text]{width:100%;padding:8px;border:1px solid #333;border-radius:8px;background:#0a0e16;color:#fff;font-size:13px;outline:0}
.controls select:focus,.controls input:focus{border-color:#1E88E5}
.controls .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.controls .grid button{padding:8px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:#1E88E5;color:#fff;white-space:nowrap}
.controls .grid button:hover{filter:brightness(1.1)}
.controls .grid button.ghost{background:transparent;border:1px solid #333;color:#8891a5}
.controls .note{font-size:11px;color:#666;margin-top:10px;padding:8px;background:#0a0e16;border-radius:6px;line-height:1.6}
</style>
</head>
<body>

<div class="dial" id="dial">
  <div class="bg" id="dialBg" style="background:#2a2d3a"></div>
  <div class="queue-indicator">3 待处理</div>
  <div class="content" id="mainContent">
    <div class="icon">⏸</div>
    <div class="title">DSH</div>
    <div class="detail">正在等待命令</div>
  </div>
  <div class="status-bar">
    <div class="item"><span class="dot on"></span><span>已连接</span></div>
    <div class="item">▂▃▄▆█</div>
    <div class="battery"><span>85%</span><div class="bar"><div style="width:85%"></div></div></div>
  </div>

  <!-- 审批弹窗 -->
  <div class="ask-overlay" id="askOverlay">
    <div class="ask-top">
      <div class="ask-agent" id="askAgent">来自: 配置助手</div>
      <div class="ask-title" id="askTitle">请输入一个域名</div>
      <div class="ask-sub" id="askSub">T9 键盘输入 · 或按住按钮语音输入</div>
      <div class="ask-body" id="askBody" style="display:none"></div>
    </div>
    <div class="ask-main" id="askMain"><!-- injected --></div>
    <div class="ask-footer" id="askFooter"></div>
  </div>

  <!-- 配网 -->
  <div class="prov-overlay" id="provOverlay">
    <div class="prov-title">首次配置 · 手机扫码连接</div>
    <div class="prov-qr"><svg viewBox="0 0 33 33"><rect width="33" height="33" fill="#fff"/>
      <path d="M4 4h4v4H4zM12 4h4v4h-4zM20 4h4v4h-4zM4 12h4v4H4zM12 12h4v4h-4zM20 12h4v4h-4zM4 20h4v4H4zM12 20h4v4h-4zM20 20h4v4h-4zM8 8h4v4H8zM16 8h4v4h-4zM24 8h4v4h-4zM8 16h4v4H8zM16 16h4v4h-4zM24 16h4v4h-4zM8 24h4v4H8zM16 24h4v4h-4zM24 24h4v4h-4z" fill="#111"/>
      <path d="M4 28h4v4H4zM12 28h4v4h-4zM20 28h4v4h-4zM28 28h4v4h-4zM28 4h4v4h-4zM28 12h4v4h-4zM28 20h4v4h-4z" fill="#111"/></svg></div>
    <div class="prov-creds">DSH-Dial-A3B2 / 8732abcd</div>
    <div class="prov-url">http://192.168.4.1</div>
  </div>
</div>

<div class="controls">
  <h2>输入方式测试 v4</h2>
  <label>输入场景</label>
  <select id="inputType">
    <option value="domain" selected>输入域名（短文本）</option>
    <option value="password">输入密码（掩码）</option>
    <option value="path">输入路径（长文本）</option>
    <option value="phrase">输入短语（多词）</option>
  </select>
  <label>提问标题</label>
  <input type="text" id="askTitleInput" value="请输入一个域名">
  <label>提示文字</label>
  <input type="text" id="askHintInput" value="例如: api.example.com">
  <div class="grid">
    <button onclick="showTextInput()">📱 显示键盘</button>
    <button onclick="showVoiceInput()">🎤 显示语音</button>
    <button class="ghost" onclick="hideAsk()">关闭弹窗</button>
    <button class="ghost" onclick="showProv()">配网界面</button>
  </div>
  <div class="note">
    <b>T9 键盘</b>：3×4 网格，适合圆屏触摸。左下 ⌫ 退格、右下 ✓ 确认。<br>
    <b>语音输入</b>：按住圆按钮 → 说话 → 松开 → 音频传到桥接 → STT 返回文字。<br>
    桥接处理 ASR（语音转文字），圆盘只需要录音和上传音频流。
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const askOverlay = $('askOverlay'), askMain = $('askMain'), askFooter = $('askFooter');
const askAgent = $('askAgent'), askTitle = $('askTitle'), askSub = $('askSub'), askBody = $('askBody');
const dial = $('dial');

let inputBuffer = '';
let isRecording = false;

// T9 key map
const T9 = [
  { label:'1', sub:'', val:'1' },
  { label:'2', sub:'ABC', val:'2' },
  { label:'3', sub:'DEF', val:'3' },
  { label:'4', sub:'GHI', val:'4' },
  { label:'5', sub:'JKL', val:'5' },
  { label:'6', sub:'MNO', val:'6' },
  { label:'7', sub:'PQRS', val:'7' },
  { label:'8', sub:'TUV', val:'8' },
  { label:'9', sub:'WXYZ', val:'9' },
  { label:'.', sub:'', val:'.' },
  { label:'0', sub:'-', val:'0' },
  { label:'⌫', sub:'清空', val:'BS' },
];

function renderT9Keyboard(){
  askMain.innerHTML = '';
  askBody.style.display = 'none';

  // 输入框
  const inputRow = document.createElement('div');
  inputRow.className = 't9-input';
  inputRow.id = 't9Input';
  inputRow.innerHTML = `<span class="ph" id="t9Placeholder">${$('askHintInput').value || '输入…'}</span><span class="cursor"></span>`;
  askMain.appendChild(inputRow);

  // T9 键盘
  const kb = document.createElement('div');
  kb.className = 't9-keyboard';
  for (let r = 0; r < 4; r++){
    const row = document.createElement('div');
    row.className = 't9-row';
    for (let c = 0; c < 3; c++){
      const k = T9[r * 3 + c];
      const btn = document.createElement('button');
      btn.className = 't9-key';
      if (k.val === 'BS') btn.className += ' fn';
      btn.innerHTML = k.label + (k.sub ? `<span class="sub">${k.sub}</span>` : '');
      btn.addEventListener('click', () => handleKey(k.val));
      row.appendChild(btn);
    }
    kb.appendChild(row);
  }
  // 底行: 符号 / 空格 / 确认
  const bot = document.createElement('div');
  bot.className = 't9-row';
  const sym = document.createElement('button');
  sym.className = 't9-key fn'; sym.textContent = '?@'; sym.addEventListener('click', () => inputBuffer += '@');
  bot.appendChild(sym);
  const spc = document.createElement('button');
  spc.className = 't9-key fn space'; spc.textContent = '空格'; spc.addEventListener('click', () => inputBuffer += ' ');
  bot.appendChild(spc);
  const ok = document.createElement('button');
  ok.className = 't9-key fn'; ok.textContent = '✓'; ok.addEventListener('click', () => { flash('已提交: ' + inputBuffer); hideAsk(); });
  bot.appendChild(ok);
  kb.appendChild(bot);
  askMain.appendChild(kb);

  askFooter.innerHTML = '';
  const v = document.createElement('button');
  v.className = 'fbtn ghost';
  v.textContent = '🎤 用语音';
  v.addEventListener('click', () => showVoiceInput());
  askFooter.appendChild(v);
  const c = document.createElement('button');
  c.className = 'fbtn ghost';
  c.textContent = '取消';
  c.addEventListener('click', () => hideAsk());
  askFooter.appendChild(c);
}

function handleKey(val){
  if (val === 'BS') {
    inputBuffer = inputBuffer.slice(0, -1);
  } else {
    // T9 multi-tap: if same key pressed within 500ms, cycle through letters
    const now = Date.now();
    inputBuffer += val;
  }
  updateT9Input();
}

function updateT9Input(){
  const ph = document.getElementById('t9Placeholder');
  if (ph) {
    ph.textContent = inputBuffer || ($('askHintInput').value || '输入…');
    ph.className = inputBuffer ? '' : 'ph';
  }
}

function renderVoiceInput(){
  askMain.innerHTML = '';
  askBody.style.display = 'block';
  askBody.textContent = '按住下方按钮，说话。松开后发送到桥接进行语音识别。';

  const sec = document.createElement('div');
  sec.className = 'voice-section';

  // 波形动画（录音时显示）
  const wave = document.createElement('div');
  wave.className = 'voice-wave';
  wave.id = 'voiceWave';
  wave.style.display = 'none';
  for (let i = 0; i < 5; i++){ const d = document.createElement('div'); wave.appendChild(d); }
  sec.appendChild(wave);

  // 大按钮
  const btn = document.createElement('button');
  btn.className = 'voice-btn';
  btn.id = 'voiceBtn';
  btn.innerHTML = '🎤<span class="label">按住说话</span>';
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    isRecording = true;
    btn.style.borderColor = '#b71c1c';
    btn.style.background = '#fff3d0';
    btn.innerHTML = '🎤<span class="label" style="color:#b71c1c">录音中…</span>';
    document.getElementById('voiceWave').style.display = 'flex';
    askSub.textContent = '正在录音，松开后发送';
  });
  btn.addEventListener('pointerup', (e) => {
    if (!isRecording) return;
    isRecording = false;
    btn.style.borderColor = '#8a6d00';
    btn.style.background = '#fff';
    btn.innerHTML = '🎤<span class="label">按住说话</span>';
    document.getElementById('voiceWave').style.display = 'none';
    askSub.textContent = '正在识别…';
    setTimeout(() => {
      inputBuffer = 'api.example.com';
      askSub.textContent = '识别结果: ' + inputBuffer + '  ✓';
      flash('已识别: ' + inputBuffer);
      setTimeout(() => { hideAsk(); }, 1200);
    }, 800);
  });
  sec.appendChild(btn);

  const hint = document.createElement('div');
  hint.className = 'voice-hint';
  hint.textContent = '松开后自动发送到桥接识别';
  sec.appendChild(hint);

  askMain.appendChild(sec);

  askFooter.innerHTML = '';
  const k = document.createElement('button');
  k.className = 'fbtn ghost';
  k.textContent = '⌨️ 用键盘';
  k.addEventListener('click', () => showTextInput());
  askFooter.appendChild(k);
  const c = document.createElement('button');
  c.className = 'fbtn ghost';
  c.textContent = '取消';
  c.addEventListener('click', () => hideAsk());
  askFooter.appendChild(c);
}

function showTextInput(){
  const t = $('inputType').value;
  const scenes = {
    domain:   { agent:'来自: 配置助手', title:'请输入一个域名', sub:'T9 键盘输入 · 或按住按钮语音输入' },
    password: { agent:'来自: 安全助手', title:'请输入密码', sub:'输入内容以 · 显示' },
    path:     { agent:'来自: 文件助手', title:'请输入文件路径', sub:'例如 /home/user/project' },
    phrase:   { agent:'来自: 搜索助手', title:'请输入搜索关键词', sub:'T9 多击输入' },
  };
  const s = scenes[t];
  askAgent.textContent = s.agent;
  askTitle.textContent = $('askTitleInput').value || s.title;
  askSub.textContent = s.sub;
  inputBuffer = '';
  renderT9Keyboard();
  askOverlay.classList.add('show');
  provOverlay.classList.remove('show');
}

function showVoiceInput(){
  const t = $('inputType').value;
  const scenes = {
    domain:   { agent:'来自: 配置助手', title:'请输入一个域名', sub:'按住按钮说话' },
    password: { agent:'来自: 安全助手', title:'请输入密码', sub:'语音输入密码' },
    path:     { agent:'来自: 文件助手', title:'请输入文件路径', sub:'语音输入路径' },
    phrase:   { agent:'来自: 搜索助手', title:'请输入搜索关键词', sub:'语音输入关键词' },
  };
  const s = scenes[$('inputType').value];
  askAgent.textContent = s.agent;
  askTitle.textContent = $('askTitleInput').value || s.title;
  askSub.textContent = s.sub;
  inputBuffer = '';
  renderVoiceInput();
  askOverlay.classList.add('show');
  provOverlay.classList.remove('show');
}

function hideAsk(){ askOverlay.classList.remove('show'); }
function showProv(){ provOverlay.classList.add('show'); askOverlay.classList.remove('show'); }

function flash(msg){
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:12px;font-size:14px;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.5);transition:opacity .5s';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 500); }, 1500);
}

$('inputType').addEventListener('change', () => { if (askOverlay.classList.contains('show')) showTextInput(); });
</script>
</body>
</html>
